version: '3.8'

services:
  backend:
    build: ./backend
    container_name: budget-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - budget-data:/app/data
    networks:
      - budget-network

  frontend:
    build: ./frontend
    container_name: budget-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - budget-network

volumes:
  budget-data:

networks:
  budget-network:
    driver: bridge
